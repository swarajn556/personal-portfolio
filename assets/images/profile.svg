<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarGrad)" stroke="url(#bgGrad)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Subtle decorative code background -->
  <text x="70" y="90" fill="#38bdf8" opacity="0.3" font-family="monospace" font-size="16">&lt;code&gt;</text>
  <text x="270" y="110" fill="#a855f7" opacity="0.3" font-family="monospace" font-size="16">{ engineering }</text>
  <text x="60" y="320" fill="#818cf8" opacity="0.3" font-family="monospace" font-size="16">&lt;/student&gt;</text>
  <text x="290" y="310" fill="#38bdf8" opacity="0.3" font-family="monospace" font-size="16">B.Tech 2028</text>

  <!-- Head and shoulders avatar -->
  <g id="student-figure">
    <!-- Body / Shoulders -->
    <path d="M 100 350 C 100 270, 140 250, 200 250 C 260 250, 300 270, 300 350 Z" fill="#2563eb" opacity="0.95"/>
    <!-- Collar / Hoodie V-neck -->
    <path d="M 175 250 L 200 290 L 225 250 Z" fill="#1e293b"/>
    <path d="M 185 250 L 200 275 L 215 250 Z" fill="#f8fafc"/>
    
    <!-- Neck -->
    <rect x="182" y="200" width="36" height="55" rx="10" fill="#fbcfe8"/>
    
    <!-- Head -->
    <ellipse cx="200" cy="175" rx="52" ry="60" fill="#fed7aa"/>
    
    <!-- Hair -->
    <path d="M 148 170 C 148 115, 175 105, 200 105 C 235 105, 255 120, 252 170 C 240 160, 230 150, 200 150 C 170 150, 158 160, 148 170 Z" fill="#1e1b4b"/>
    <path d="M 148 165 C 145 130, 170 112, 205 110 C 245 108, 255 135, 252 165 C 238 142, 172 138, 148 165 Z" fill="#312e81"/>

    <!-- Eyeglasses (Student/Engineer look) -->
    <rect x="162" y="165" width="30" height="22" rx="6" fill="none" stroke="#0284c7" stroke-width="3.5"/>
    <rect x="208" y="165" width="30" height="22" rx="6" fill="none" stroke="#0284c7" stroke-width="3.5"/>
    <line x1="192" y1="174" x2="208" y2="174" stroke="#0284c7" stroke-width="3.5"/>
    <!-- Glasses temples -->
    <line x1="149" y1="172" x2="162" y2="172" stroke="#0284c7" stroke-width="3"/>
    <line x1="238" y1="172" x2="251" y2="172" stroke="#0284c7" stroke-width="3"/>

    <!-- Eyes -->
    <circle cx="177" cy="176" r="3.5" fill="#1e293b"/>
    <circle cx="223" cy="176" r="3.5" fill="#1e293b"/>

    <!-- Smile -->
    <path d="M 188 206 Q 200 216 212 206" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Floating Tech Badges -->
  <g transform="translate(45, 180)">
    <rect width="60" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="30" y="17" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">&lt;HTML5&gt;</text>
  </g>
  <g transform="translate(295, 180)">
    <rect width="60" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
    <text x="30" y="17" fill="#818cf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">#CSS3</text>
  </g>
</svg>