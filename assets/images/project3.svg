<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p3Grad)"/>
  
  <!-- Campus Map Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="50" y1="50" x2="550" y2="50"/>
    <line x1="50" y1="100" x2="550" y2="100"/>
    <line x1="50" y1="150" x2="550" y2="150"/>
    <line x1="50" y1="200" x2="550" y2="200"/>
    <line x1="50" y1="250" x2="550" y2="250"/>
    <line x1="50" y1="300" x2="550" y2="300"/>
    
    <line x1="100" y1="50" x2="100" y2="300"/>
    <line x1="200" y1="50" x2="200" y2="300"/>
    <line x1="300" y1="50" x2="300" y2="300"/>
    <line x1="400" y1="50" x2="400" y2="300"/>
    <line x1="500" y1="50" x2="500" y2="300"/>
  </g>

  <!-- Campus Buildings (Stylized isometric/2D layout) -->
  <!-- CS Block -->
  <rect x="80" y="80" width="130" height="90" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
  <rect x="90" y="90" width="110" height="20" rx="4" fill="#312e81"/>
  <text x="145" y="104" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CS &amp; IT Dept</text>
  <circle cx="105" cy="130" r="4" fill="#818cf8"/>
  <circle cx="125" cy="130" r="4" fill="#818cf8"/>
  <circle cx="145" cy="130" r="4" fill="#818cf8"/>
  <circle cx="165" cy="130" r="4" fill="#818cf8"/>
  <circle cx="185" cy="130" r="4" fill="#818cf8"/>

  <!-- Main Central Library -->
  <rect x="250" y="70" width="160" height="110" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="265" y="80" width="130" height="22" rx="4" fill="#0369a1"/>
  <text x="330" y="95" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Central Library &amp; Labs</text>
  <rect x="280" y="120" width="100" height="40" rx="4" fill="#0f172a"/>
  <text x="330" y="145" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">24/7 Digital Hub</text>

  <!-- Innovation Center -->
  <rect x="180" y="210" width="180" height="85" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
  <rect x="195" y="220" width="150" height="22" rx="4" fill="#831843"/>
  <text x="270" y="235" fill="#fbcfe8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Incubation &amp; Robotics</text>

  <!-- Pathway -->
  <path d="M 210 125 L 250 125 M 330 180 L 330 210 M 270 210 L 210 170" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6,4" fill="none"/>

  <!-- Info Overlay Card -->
  <rect x="420" y="140" width="150" height="155" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <circle cx="450" cy="165" r="12" fill="url(#pinGrad)"/>
  <text x="450" y="170" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">📍</text>
  <text x="475" y="170" fill="#f8fafc" font-family="sans-serif" font-weight="bold" font-size="12">Wayfinder</text>
  <line x1="435" y1="190" x2="555" y2="190" stroke="#334155"/>
  <text x="435" y="210" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Route:</text>
  <text x="435" y="225" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="11">Gate 1 → CSE Lab 3</text>
  <text x="435" y="250" fill="#94a3b8" font-family="sans-serif" font-size="10">Est. Walk: 3 mins</text>
  <rect x="435" y="265" width="120" height="18" rx="4" fill="#38bdf8" opacity="0.2"/>
  <text x="495" y="278" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ACCESSIBLE ROUTE</text>
</svg>